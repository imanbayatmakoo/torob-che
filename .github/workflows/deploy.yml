name: Test and deploy to Liara
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liara-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt pytest
          cd backend
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Liara CLI
        run: npm install -g @liara/cli@9.6.0
      - name: Deploy checked-out source
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          test -n "$LIARA_API_TOKEN" || { echo 'Set the LIARA_API_TOKEN repository Actions secret.'; exit 1; }
          liara deploy --app torob-che --port 8000 --team-id 6ad86c8384eee4f39401e7b8 --api-token "$LIARA_API_TOKEN" --detach
      - name: Verify the exact release is healthy
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: python scripts/verify_deployment.py
