<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d73948" />
  <title>تربچه (torob-che) — دستیار خرید حضوری</title>
  <script>try{var t=localStorage.getItem("torob_che_theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo">ت</span>
        <div>
          <div class="title">تربچه</div>
          <div class="sub">گوشی و هر کالایی؛ خرید حضوری بدون سردرگمی</div>
        </div>
      </div>
      <div class="tools">
        <button id="theme" type="button" class="ghost" aria-pressed="false" aria-label="فعال‌سازی حالت تیره" title="حالت تیره">🌙</button>
        <button id="reset" class="ghost" title="شروع دوباره">از اول</button>
      </div>
    </header>
    <nav class="steps" id="steps">
      <div class="step" data-s="0"><b>۰</b><span>وسیلهٔ فعلی</span></div>
      <div class="step" data-s="1"><b>۱</b><span>انتخاب درست</span></div>
      <div class="step" data-s="2"><b>۲</b><span>مغازه‌ها</span></div>
      <div class="step" data-s="3"><b>۳</b><span>مقایسه</span></div>
      <div class="step" data-s="4"><b>۴</b><span>تماس و مسیر</span></div>
    </nav>
    <div class="profile" id="profile"></div>
    <main id="feed"></main>
    <footer class="composer">
      <div class="chips" id="chips"></div>
      <div class="row">
        <select id="area" class="area" aria-label="منطقهٔ خرید" title="منطقهٔ خرید (شرط سخت)">
          <option value="">📍 همه</option><option value="شیخ هادی">جمهوری</option><option value="فردوسی">فردوسی</option>
          <option value="بهارستان">بهارستان</option><option value="تجریش">تجریش</option>
        </select>
        <label class="toggle" title="فیلتر سخت: فقط مغازه‌هایی که در ترب روش پرداخت اقساطی ثبت کرده‌اند">
          <input type="checkbox" id="inst" /><span>اقساطی</span>
        </label>
        <input id="text" autocomplete="off" placeholder="چه می‌خواهید؟ گوشی، هدفون، پاوربانک، …" />
        <button id="send" class="primary">ارسال</button>
      </div>
    </footer>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
